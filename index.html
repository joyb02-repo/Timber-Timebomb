["Plywood is strong because its veneers are…","Glued with grain alternating at right angles","Glued with all grain parallel","Nailed together","Woven"],
["MDF is made from…","Wood fibres bonded with resin under heat and pressure","Thin peeled veneers","Solid sawn boards","Large wood strands"],
["Particleboard is made from…","Wood chips and particles bonded with resin","Wood fibres only","Solid timber","Peeled veneers"],
["Why is timber chemically treated (e.g. treated pine)?","To resist fungi and insects like termites","To make it lighter","To make it bendier","To speed up drying"],
["Heartwood is…","The older, darker, more durable inner wood","The living outer wood","The bark","The growth layer"],
["The cambium layer is…","A thin growth layer producing new wood and bark cells","The dead centre of the tree","The outer bark","A type of knot"],
["What is timber ‘grain’?","The direction of the wood fibres","The number of knots","The moisture content","The colour of the bark"],
["What is a knot in timber?","The base of a branch embedded in the trunk","A joint between boards","A drying crack","A type of finish"],
["What is ‘cupping’?","A board curving across its width","A board twisting along its length","A split at the end","A hole made by insects"],
["Which joint is commonly used in quality drawer construction?","Dovetail joint","Butt joint","Biscuit-less lap","Pocket screw"],
["Which PPE best protects you from fine wood dust?","P2 respirator","Sunglasses","Cotton gloves","Ear muffs only"],
["LVL (laminated veneer lumber) is mainly used for…","Structural beams and framing","Cheap packaging","Paper making","Veneer decoration"],
["What does an FSC label tell you?","Timber is from responsibly managed forests","Timber is fire-proof","Timber is kiln-dried","Timber is imported"],
["What do annual growth rings show?","Tree growth over each year","Moisture level","Termite damage","The wood’s strength rating"],
["Which tool measures the moisture content of timber?","Moisture meter","Marking gauge","Spirit level","Bevel gauge"],
["Which is a softwood?","Radiata pine","Jarrah","Blackbutt","Red gum"],
["Timber is considered a sustainable material because it is…","Renewable and can be replanted","Never used up","Made from plastic","Always imported"]];
const HARD=["Jarrah","Blackbutt","Spotted gum","Red gum","Tasmanian oak","Ironbark"],SOFT=["Radiata pine","Hoop pine","Douglas fir","Slash pine","Western red cedar","Cypress pine"];
const SEQ=[
["Timber: from tree to dressed board",["Fell the tree","Transport logs to the sawmill","Saw logs into boards","Season (dry) the boards","Dress (plane) to size"]],
["Making plywood",["Peel the log into veneers","Dry the veneers","Apply adhesive","Layer with alternating grain","Hot-press the sheet"]],
["Finishing a timber surface",["Sand with coarse grit","Sand with fine grit","Remove the dust","Apply the first coat","Apply the final coat"]],
["Making MDF",["Chip the wood","Break chips into fibres","Mix fibres with resin","Form a mat","Hot-press and sand"]]];
const MATCH=[["Heartwood","Older, darker, durable inner wood"],["Sapwood","Younger outer wood, less durable"],["Cambium","Thin growth layer under the bark"],["Kiln","Chamber for controlled drying"],["Veneer","Thin sheet peeled or sliced from a log"],["Dovetail","Interlocking joint for drawers"],["MDF","Fibreboard with a smooth paintable surface"],["Cupping","Board curves across its width"],["Seasoning","Reducing moisture content in timber"],["Plywood","Veneers glued with alternating grain"]];
const RANKS=[[0,"Sapling",1,"Just starting to grow. Keep studying your timber facts!"],[800,"Lumberjack",2,"You can handle the basics of timber and wood technology."],[2000,"Sawyer",3,"Solid knowledge of timber properties, processing and products."],[4000,"Master Joiner",4,"Excellent! You know your materials and your processes."],[6500,"Timber Titan",5,"Legendary! Nothing about timber technology gets past you."]];
let t,score,streak,best,done,run,last,lastType,usedQ,busy,ts,lim,mx,spTot,paused=false,cheat=false,freezeT=0,shieldN=0,dbl=0,pin="";
function dots(){const k=streak>0&&streak%5==0?5:streak%5;$("#dots").innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<k?"on":""}"></i>`).join("")}
function upd(){$("#sc").textContent=score;$("#st").textContent=streak;$("#dn").textContent=done;dots()}
function draw(){const p=Math.min(100,t/MAXT*100),r=$("#rope");r.style.width=p+"%";r.className=t<10?"low":t<25?"mid":"";$("#tm").textContent=t.toFixed(1)+"s"+(freezeT>0?"  FROZEN "+Math.ceil(freezeT):"");$("#bomb").classList.toggle("panic",t<10&&run&&freezeT<=0);
 if(run&&!busy){const f=Math.max(0,1-(performance.now()-ts)/1000/lim);$("#sbi").style.width=f*100+"%";$("#sbv").textContent="+"+Math.round(mx*f)}else if(!run){$("#sbv").textContent="+0"}}
function pop(txt,c){const e=document.createElement("div");e.className="pop";e.style.color=c;e.textContent=txt;$("#pops").appendChild(e);setTimeout(()=>e.remove(),1100)}
function add(s){t=Math.max(0,Math.min(MAXT,t+s));pop((s>0?"+":"\u2212")+Math.abs(s)+"s",s>0?"#4ade80":"#f87171")}
function err(){pen(1)}
function loop(){if(!run)return;const n=performance.now(),dt=(n-last)/1000;last=n;
 if(paused){ts+=dt*1000;requestAnimationFrame(loop);return}
 if(freezeT>0){freezeT=Math.max(0,freezeT-dt);if(freezeT==0)iceOff()}else t-=dt;
 if(t<=0){t=0;draw();boom();return}draw();requestAnimationFrame(loop)}
const POW=[["TIME FREEZE","Timer locked for 30 seconds"],["ANSWER SHIELD","5 free wrong-answer hits"],["x2 POINTS","Double points for the next 3 answers"]];
let hkS="",rollT=null;
function pen(s){if(shieldN>0){shieldN--;hitX();pop("BLOCKED","#38bdf8");return}add(-s)}
function gain(p){if(dbl>0){p*=2;dbl--;$("#gl").textContent=dbl;if(dbl==0)setTimeout(goldOff,900)}score+=p;return p}
function iceOn(){["#icet","#iceb"].forEach(q=>$(q).classList.add("on"));document.body.classList.add("frozen")}
function iceOff(){["#icet","#iceb"].forEach(q=>$(q).classList.remove("on"));document.body.classList.remove("frozen")}
function goldOn(){document.body.classList.add("gold");$("#gp").classList.remove("hide");$("#gl").textContent=dbl}
function goldOff(){document.body.classList.remove("gold");$("#gp").classList.add("hide")}
function renderX(){const x=$("#xs");x.classList.remove("hide");x.innerHTML="<span>ANSWER SHIELD</span>"+[0,1,2,3,4].map(i=>`<i class="${i<5-shieldN?"hit":""}">X</i>`).join("")}
function hitX(){renderX();if(shieldN==0)setTimeout(()=>{if(shieldN==0)$("#xs").classList.add("hide")},900)}
function cancelCheats(){freezeT=0;shieldN=0;dbl=0;paused=false;clearInterval(rollT);hkS="";$("#hk2").classList.add("hide");iceOff();goldOff();$("#xs").classList.add("hide")}
function pinUI(m,c){$("#pdisp").innerHTML=[0,1,2,3].map(i=>`<i>${i<pin.length?"\u25cf":""}</i>`).join("");$("#pmsg").className=c||"";$("#pmsg").textContent=m||""}
function openHk(){if(!run||cheat||hkS)return;paused=true;pin="";hkS="pin";$("#roll").textContent="";$("#hk2").classList.remove("hide");pinUI("ENTER ACCESS PIN")}
function closeHk(){if(hkS=="roll")return;hkS="";paused=false;$("#hk2").classList.add("hide")}
function keyp(d){if(hkS!="pin"||pin.length>3)return;pin+=d;pinUI("ENTER ACCESS PIN")}
function subm(){if(hkS!="pin")return;if(pin=="2947"){hkS="roll";pinUI("ACCESS GRANTED. ROLLING...");rollIt()}else{pinUI("ACCESS DENIED","bd");pin="";setTimeout(()=>{if(hkS=="pin")pinUI("ENTER ACCESS PIN")},900)}}
function activate(k){if(k==0){freezeT=30;iceOn()}else if(k==1){shieldN=5;renderX()}else{dbl=3;goldOn()}}
function rollIt(){const k=Math.random()*3|0;let i=0;rollT=setInterval(()=>{$("#roll").textContent=POW[i++%3][0]},90);
 setTimeout(()=>{clearInterval(rollT);$("#roll").innerHTML=POW[k][0]+"<br><small style='font-size:.75rem;color:#4ade80'>"+POW[k][1]+"</small>";cheat=true;$("#hk").classList.add("broken");activate(k);setTimeout(()=>{hkS="";closeHk()},2000)},1700)}
$("#kp").innerHTML=[1,2,3,4,5,6,7,8,9,"CLR",0,"ENT"].map(k=>`<button data-k="${k}">${k}</button>`).join("");
$("#kp").onclick=e=>{const k=e.target.dataset.k;if(k==null)return;k=="CLR"?(pin="",pinUI("ENTER ACCESS PIN")):k=="ENT"?subm():keyp(k)};
$("#hk").onclick=openHk;$("#hkx").onclick=closeHk;
addEventListener("keydown",e=>{if(hkS!="pin")return;if(/^\d$/.test(e.key))keyp(e.key);else if(e.key=="Backspace"){pin=pin.slice(0,-1);pinUI("ENTER ACCESS PIN")}else if(e.key=="Enter")subm();else if(e.key=="Escape")closeHk()});
setInterval(()=>{if(dbl>0&&run)fly($("#fx"),pick(["o-coin","o-coin","o-x2"]))},350);
// flying objects
function fly(layer,fy){const e=document.createElement("div"),ty=fy||pick(["o-plank","o-plank","o-log","o-nail","o-bomb","o-chip","o-chip"]);
 e.className="fo "+ty;if(ty=="o-x2")e.textContent="x2";const W=innerWidth,H=innerHeight,ltr=Math.random()<.5,y0=Math.random()*H,y1=Math.random()*H;
 e.style.setProperty("--x0",(ltr?-150:W+150)+"px");e.style.setProperty("--x1",(ltr?W+150:-150)+"px");
 e.style.setProperty("--y0",y0+"px");e.style.setProperty("--y1",y1+"px");e.style.setProperty("--r",(Math.random()<.5?-1:1)*(180+Math.random()*540)+"deg");
 e.style.setProperty("--d",(7+Math.random()*8)+"s");e.style.setProperty("--o",layer.id=="ovfx"||fy?.9:.4);
 layer.appendChild(e);setTimeout(()=>e.remove(),16000)}
setInterval(()=>{const ov=!$("#ov").classList.contains("hide");fly(ov?$("#ovfx"):$("#fx"))},900);
for(let i=0;i<6;i++)setTimeout(()=>fly($("#ovfx")),i*250);
function start(){cancelCheats();cheat=false;$("#hk").classList.remove("broken");t=30;score=0;streak=0;best=0;done=0;spTot=0;usedQ=[];lastType="";run=true;busy=false;last=performance.now();$("#ov").classList.add("hide");$("#bomb").classList.remove("boom","panic");$("#fb").innerHTML="";$("#task").style.opacity=1;upd();next();requestAnimationFrame(loop)}
function dlg(c,b,s,dl,rt,pd){return `<div class="dw" style="--dl:${dl}s"><div class="dlg ${c}" style="--dl:${dl+.6}s;--rt:${rt}deg;--pd:${pd}s"><b>${b}</b><span>${s}</span></div></div>`}
function intro(){$("#ovc").innerHTML=`<div class="ttl"><div id="tb"></div><h1><span>TIMBER</span><span>TIME-BOMB</span></h1></div>
<div class="sub">The fuse is burning. Answer timber tech tasks to buy more time.</div>
<div class="dgrid">${dlg("d1","+10s","Every correct task adds time to the fuse",.1,-1.5,2.6)}${dlg("d2","5 in a row","Every 5th correct answer gives +15s instead",.3,1.2,3)}${dlg("d3","Speed bonus","The faster you finish, the more points you bank",.5,1.5,2.8)}${dlg("d4","\u22121s extra","Every error costs an extra second. Wrong quiz answers: \u22124s",.7,-1.2,3.2)}${dlg("d5","+10 \u00d7 streak","Streak points compound with every correct task in a row",.9,0,3.4)}</div>
<button class="btn go ovgo" id="go">LIGHT THE FUSE</button>`;
 const c=$("#bomb").cloneNode(true);c.removeAttribute("id");c.setAttribute("class","");$("#tb").appendChild(c);$("#go").onclick=start}
function boom(){run=false;cancelCheats();$("#bomb").classList.remove("panic");$("#bomb").classList.add("boom");$("#task").style.opacity=.4;
setTimeout(()=>{let r=RANKS[0];RANKS.forEach(x=>{if(score>=x[0])r=x});
$("#ovc").innerHTML=`<h2 style="font-size:2rem;color:#fde047;animation:pin .5s">BOOM! The fuse ran out</h2><div class="ringb"><b>LV ${r[2]}</b></div><h1 style="font-size:2.4rem">${r[1]}</h1><div class="sub">${r[3]}</div><div class="sc">${score} pts</div>
<div class="dgrid" style="grid-template-columns:repeat(3,1fr)">${dlg("d1",done,"Tasks done",.1,-1.5,2.6)}${dlg("d2",best,"Best streak",.3,1.2,3)}${dlg("d3",spTot,"Speed points",.5,-1,2.8)}</div>
<button class="btn go ovgo" id="again">PLAY AGAIN</button>`;
$("#again").onclick=start;$("#ov").classList.remove("hide")},1100)}
function next(){busy=false;$("#fb").innerHTML="";let ty;do{ty=pick(["q","q","q","sort","seq","match"])}while(ty==lastType);lastType=ty;
ts=performance.now();lim=ty=="q"?8:20;mx=ty=="q"?50:100;({q:mcq,sort:sort,seq:seq,match:match})[ty]()}
function finish(m,kind,info){if(busy)return;busy=true;$("#sbv").textContent="";let msg,d=1000;
if(m==0){streak++;best=Math.max(best,streak);const base=kind=="q"?100:150,b=10*streak,five=streak%5==0,s=five?15:10,sp=Math.round(mx*Math.max(0,1-(performance.now()-ts)/1000/lim));
const g=gain(base+b+sp);spTot+=sp;add(s);done++;
msg=`<div class="msg g">Correct! ${base} pts + ${b} streak + ${sp} speed${g>base+b+sp?" = "+g+" with x2":""}. ${five?"<u>5-in-a-row bonus: +15s instead of +10s!</u>":"+10s"}</div>`}
else{streak=0;if(kind=="q"){const bl=shieldN>0;pen(4);d=1800;msg=`<div class="msg r">Not quite. Answer: ${info}. ${bl?"Shield blocked the penalty!":"\u22124s penalty (incl. \u22121s error)."} Streak lost.</div>`}
else{gain(50);add(5);done++;msg=`<div class="msg r">Finished with ${m} mistake${m>1?"s":""} (\u22121s each). Streak lost. +50 pts, +5s</div>`}}
$("#fb").innerHTML=msg;upd();setTimeout(()=>{if(run)next()},d)}
function mcq(){let k;do{k=Math.random()*MCQ.length|0}while(usedQ.includes(k)&&usedQ.length<MCQ.length);usedQ.push(k);if(usedQ.length>=MCQ.length)usedQ=[k];
const q=MCQ[k];$("#task").innerHTML=`<span class="tag">QUICK QUIZ</span><div class="q">${q[0]}</div><div id="o">${sh(q.slice(1)).map(o=>`<button class="btn">${o}</button>`).join("")}</div>`;
document.querySelectorAll("#o .btn").forEach(b=>b.onclick=()=>{if(busy)return;const ok=b.textContent==q[1];document.querySelectorAll("#o .btn").forEach(x=>{x.disabled=true;if(ok&&x==b)x.classList.add("ok")});if(!ok)b.classList.add("bad");finish(ok?0:1,"q",q[1])})}
function sort(){const it=sh([...HARD.map(n=>[n,"Hardwood"]),...SOFT.map(n=>[n,"Softwood"])]).slice(0,5);let i=0,m=0;
const r=()=>{$("#task").innerHTML=`<span class="tag s">SORT IT</span><div class="q">Hardwood or softwood? (${i+1}/5)</div><div class="big">${it[i][0]}</div><div class="two"><button class="btn go" data-a="Hardwood">Hardwood</button><button class="btn go" data-a="Softwood">Softwood</button></div>`;
document.querySelectorAll("#task [data-a]").forEach(b=>b.onclick=()=>{if(busy)return;if(b.dataset.a!=it[i][1]){m++;err()}else pop("\u2713","#4ade80");i++;i<5?r():finish(m,"s")})};r()}
function seq(){const s=pick(SEQ);let i=0,m=0;
$("#task").innerHTML=`<span class="tag o">PUT IN ORDER</span><div class="q">${s[0]}: tap the steps in order</div><div id="o">${sh(s[1]).map(o=>`<button class="btn">${o}</button>`).join("")}</div>`;
document.querySelectorAll("#o .btn").forEach(b=>b.onclick=()=>{if(busy||b.disabled)return;if(b.textContent==s[1][i]){b.disabled=true;b.classList.add("ok");b.textContent=(i+1)+". "+b.textContent;i++;if(i==s[1].length)finish(m,"s")}else{m++;err();b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),450)}})}
function match(){const p=sh(MATCH).slice(0,4);let sel=null,m=0,n=0;
$("#task").innerHTML=`<span class="tag m">MATCH UP</span><div class="q">Tap a term, then tap its meaning</div><div class="mt"><div>${p.map(x=>`<button class="btn" data-l="${x[0]}">${x[0]}</button>`).join("")}</div><div>${sh(p).map(x=>`<button class="btn" data-r="${x[0]}">${x[1]}</button>`).join("")}</div></div>`;
document.querySelectorAll("#task [data-l]").forEach(b=>{b.onclick=()=>{if(b.classList.contains("done")||busy)return;document.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));sel=b;b.classList.add("sel")}});
document.querySelectorAll("#task [data-r]").forEach(b=>{b.onclick=()=>{if(!sel||b.classList.contains("done")||busy)return;if(sel.dataset.l==b.dataset.r){sel.classList.remove("sel");sel.classList.add("done");b.classList.add("done");sel=null;n++;if(n==4)finish(m,"m")}else{m++;err();b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),450)}}})}
t=30;score=0;streak=0;done=0;draw();upd();intro();
</script></body></html>
